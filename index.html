<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<title>DoorDash D1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="web/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<main id="view">
  <div id="mode" class="mode" hidden>
    <p id="mode-text"></p>
    <button id="leave-demo" type="button">Leave demo</button>
  </div>
  <div id="vb" aria-live="polite"></div><div id="va"></div>
  <p id="status" class="status" role="status"></p>
</main>
<section id="places" class="places" hidden aria-label="My places">
  <h1>Add a place</h1>
  <p class="hint">Places you add are kept only in this browser.</p>
  <button id="place-here" type="button">Use my current location</button>
  <div class="row" id="place-here-form" hidden>
    <input id="place-name" maxlength="60" autocomplete="off" placeholder="Name, for example Home" aria-label="Name for this place">
    <button id="place-save" type="button">Save</button>
  </div>
  <p id="place-msg" role="status"></p>
  <h2>Find a landmark</h2>
  <input id="place-search" type="search" autocomplete="off" placeholder="Search Wellington landmarks" aria-label="Search landmarks">
  <ul id="place-results" class="plist"></ul>
  <h2>My places</h2>
  <ul id="place-list" class="plist"></ul>
  <button id="places-close" type="button" class="done">Done</button>
</section>
<details class="dev rt" id="rt-panel">
  <summary>Metlink realtime</summary>
  <p id="rt-msg" role="status"></p>
  <div class="row" id="rt-entry" hidden>
    <input type="password" id="rt-key" autocomplete="off" spellcheck="false" placeholder="API key" aria-label="Metlink API key">
    <button id="rt-save" type="button">Save and connect</button>
    <button id="rt-cancel" type="button" hidden>Cancel</button>
  </div>
  <div class="row" id="rt-manage" hidden>
    <button id="rt-replace" type="button">Replace key</button>
    <button id="rt-forget" type="button">Forget key</button>
  </div>
  <p id="rt-status"></p>
  <form class="row" id="rt-check-form">
    <input id="rt-stop" inputmode="numeric" placeholder="Stop number" aria-label="Stop number" size="8">
    <button type="submit">Check stop</button>
  </form>
  <div id="rt-check"></div>
</details>
<details class="dev" id="sim-panel" hidden>
  <summary>Simulation / test controls</summary>
  <div class="row">
    <select id="scenario" aria-label="Scenario"></select>
    <select id="speed" aria-label="Speed">
      <option value="1">1×</option><option value="5">5×</option>
      <option value="10" selected>10×</option><option value="20">20×</option>
    </select>
  </div>
  <div class="row">
    <label><input type="checkbox" id="autotap" checked> simulated taps</label>
    <label><input type="checkbox" id="noise"> noisy GPS</label>
  </div>
  <div class="row">
    <button id="start-sim">Restart simulation</button>
    <button id="droprt">Drop live data</button>
  </div>
</details>
<script type="module" src="web/app.js"></script>
</body>
</html>
